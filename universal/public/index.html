<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Sebas POS</title>

    <!-- PWA: instalable en iPhone / Android / escritorio -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sebas POS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style id="app-reset">
      html, body { height: 100%; background: #000; }
      body { overflow: hidden; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea { font-size: 16px; } /* evita el zoom automático de iOS Safari */
    </style>
  </head>
  <body>
    <noscript>Sebas POS necesita JavaScript.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
